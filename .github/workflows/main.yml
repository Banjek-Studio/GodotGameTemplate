name: "Export & Publish (Secrets Fix)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ---------------------------------------------------------------------------
# GLOBAL ENVIRONMENT VARIABLES
# We map secrets to env vars here so we can check them in 'if' conditions.
# ---------------------------------------------------------------------------
env:
  GODOT_VERSION: 4.5.1
  
  # Secrets are mapped to ENV variables here
  # This allows us to use 'env.ITCH_GAME_ID' in logical checks
  ITCH_GAME_ID: ${{ secrets.ITCH_GAME_ID }}
  ITCH_USER: ${{ secrets.ITCH_USER }}
  BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}

jobs:
  export_game:
    runs-on: ubuntu-latest
    permissions: write-all
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install Wine
      - name: Install Wine
        id: wine_install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32
          echo "WINE_PATH=$(which wine)" >> $GITHUB_OUTPUT

      # 2. Get Version from Godot Project
      # Reads the version you set in Godot (Project Settings -> Config -> Version)
      - name: Get Game Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep "config/version=" project.godot | cut -d '"' -f 2)
          
          if [ -z "$VERSION" ]; then
            VERSION="0.0.${{ github.run_number }}"
            echo "::warning::Could not find version in project.godot! Using fallback: $VERSION"
          fi
          
          echo "GAME_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected Version: $VERSION"

      # 3. Setup and Export Godot
      # MAKE SURE you pushed the fixed export_presets.cfg file!
      - name: Setup and Export Godot
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}
          use_preset_export_path: true

      # 4. Check Secrets (Using env vars now)
      - name: Check Secrets
        if: env.ITCH_GAME_ID == '' || env.ITCH_USER == ''
        run: |
          echo "::warning::ITCH_GAME_ID or ITCH_USER is missing in Secrets!"

      # 5. Deploy Windows
      - name: Deploy Windows to Itch.io
        if: success() && env.ITCH_GAME_ID != '' && env.ITCH_USER != ''
        uses: manleydev/butler-publish-itchio-action@master
        env:
          CHANNEL: windows
          ITCH_GAME: ${{ env.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Windows Desktop.zip
          VERSION: ${{ env.GAME_VERSION }}

      # 6. Deploy Linux
      - name: Deploy Linux to Itch.io
        if: success() && env.ITCH_GAME_ID != '' && env.ITCH_USER != ''
        uses: manleydev/butler-publish-itchio-action@master
        env:
          CHANNEL: linux
          ITCH_GAME: ${{ env.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Linux.zip
          VERSION: ${{ env.GAME_VERSION }}

      # 7. Deploy Web
      - name: Deploy Web to Itch.io
        if: success() && env.ITCH_GAME_ID != '' && env.ITCH_USER != ''
        uses: manleydev/butler-publish-itchio-action@master
        env:
          CHANNEL: html5
          ITCH_GAME: ${{ env.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Web.zip
          VERSION: ${{ env.GAME_VERSION }}

      # 8. Create GitHub Release
      - name: Create GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ env.GAME_VERSION }}"
          name: "Release v${{ env.GAME_VERSION }}"
          body: "Automated build for version ${{ env.GAME_VERSION }}"
          artifacts: "${{ steps.export.outputs.archive_directory }}/*.zip"
          allowUpdates: true