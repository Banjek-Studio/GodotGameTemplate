name: "Export & Publish (Godot 4.5.1)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Using the stable version 4.5.1
  GODOT_VERSION: 4.5.1
  
  # Your Itch.io username
  ITCH_USER: kharachko
  
  # NOTE: ITCH_GAME_ID is retrieved automatically from Repository Variables
  # (Settings -> Secrets and variables -> Actions -> Variables)

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: Export & Release
    permissions: write-all
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install Wine
      # Required for Godot to correctly embed icons and metadata into Windows .exe files on Linux
      - name: Install Wine
        id: wine_install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32
          echo "WINE_PATH=$(which wine)" >> $GITHUB_OUTPUT

      # 2. Setup and Export Godot
      # Uses Godot 4.5.1 and the Wine path configured above
      - name: Setup and Export Godot
        uses: firebelley/godot-export@v6
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true
          # Pass the Wine path to the exporter
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}

      # 3. Check Game ID
      # Prevents accidental uploads if you forget to set the variable in a new repo
      - name: Check ITCH_GAME_ID
        if: vars.ITCH_GAME_ID == ''
        run: |
          echo "::warning::ITCH_GAME_ID not found! Game will NOT be uploaded to Itch.io (GitHub Release only)."

      # 4. Deploy Windows
      - name: Deploy Windows to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_WINDOWS != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/${{ github.event.repository.name }}-Windows\ Desktop.zip
          VERSION: ${{ github.run_number }}

      # 5. Deploy Linux
      - name: Deploy Linux to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_LINUX != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/${{ github.event.repository.name }}-Linux.zip
          VERSION: ${{ github.run_number }}

      # 6. Deploy Web
      - name: Deploy Web to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_WEB != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/${{ github.event.repository.name }}-Web.zip
          VERSION: ${{ github.run_number }}

      # 7. Create GitHub Release
      # Always creates a downloadable release on GitHub
      - name: Create GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.${{ github.run_number }}"
          name: "Release v1.${{ github.run_number }}"
          body: "Build Godot ${{ env.GODOT_VERSION }}"
          artifacts: "*.zip"
          allowUpdates: true