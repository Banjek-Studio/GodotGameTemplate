name: "Export & Publish (Auto Paths)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  # ITCH_USER and ITCH_GAME_ID are retrieved automatically from Variables.

jobs:
  export_game:
    runs-on: ubuntu-latest
    permissions: write-all
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install Wine
      - name: Install Wine
        id: wine_install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32
          echo "WINE_PATH=$(which wine)" >> $GITHUB_OUTPUT

      # 2. Setup and Export Godot
      # FIX: I removed "use_preset_export_path: true".
      # Now the action will automatically generate paths regardless of your Godot settings.
      - name: Setup and Export Godot
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}

      # 3. Check Variables
      - name: Check Variables
        if: vars.ITCH_GAME_ID == '' || vars.ITCH_USER == ''
        run: |
          echo "::warning::ITCH_GAME_ID or ITCH_USER is missing!"
          echo "Make sure ITCH_USER is set in Organization Variables and ITCH_GAME_ID in Repository Variables."

      # 4. Deploy Windows
      - name: Deploy Windows to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.ITCH_USER != '' && vars.DISABLE_WINDOWS != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          # The action automatically names the zip based on the preset name
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Windows Desktop.zip
          VERSION: ${{ github.run_number }}

      # 5. Deploy Linux
      - name: Deploy Linux to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.ITCH_USER != '' && vars.DISABLE_LINUX != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Linux.zip
          VERSION: ${{ github.run_number }}

      # 6. Deploy Web
      - name: Deploy Web to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.ITCH_USER != '' && vars.DISABLE_WEB != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Web.zip
          VERSION: ${{ github.run_number }}

      # 7. Create GitHub Release
      - name: Create GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.${{ github.run_number }}"
          name: "Release v1.${{ github.run_number }}"
          body: "Build Godot ${{ env.GODOT_VERSION }}"
          artifacts: "${{ steps.export.outputs.archive_directory }}/*.zip"
          allowUpdates: true