name: "Export & Publish (Fix)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Using Godot 4.5.1
  GODOT_VERSION: 4.5.1
  
  # Your Itch.io username
  ITCH_USER: kharachko
  
  # NOTE: ITCH_GAME_ID is retrieved automatically from Repository Variables

jobs:
  export_game:
    runs-on: ubuntu-latest
    permissions: write-all
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install Wine
      # Required for Godot to correctly embed icons and metadata into Windows .exe files on Linux
      - name: Install Wine
        id: wine_install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32
          echo "WINE_PATH=$(which wine)" >> $GITHUB_OUTPUT

      # 2. Setup and Export Godot (v7.0.0)
      - name: Setup and Export Godot
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true
          # Pass the Wine path to the exporter
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}
          # Important: Use the paths defined in your export_presets.cfg
          use_preset_export_path: true

      # 3. Check Game ID
      - name: Check ITCH_GAME_ID
        if: vars.ITCH_GAME_ID == ''
        run: |
          echo "::warning::ITCH_GAME_ID not found! Game will NOT be uploaded to Itch.io."

      # 4. Deploy Windows
      # Note: Ensure your Godot export preset is named "Windows Desktop"
      - name: Deploy Windows to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_WINDOWS != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          # Path construction: Archive Directory + Preset Name + .zip
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Windows Desktop.zip
          VERSION: ${{ github.run_number }}

      # 5. Deploy Linux
      # Note: Ensure your Godot export preset is named "Linux"
      - name: Deploy Linux to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_LINUX != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Linux.zip
          VERSION: ${{ github.run_number }}

      # 6. Deploy Web
      # Note: Ensure your Godot export preset is named "Web"
      - name: Deploy Web to Itch.io
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_WEB != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Web.zip
          VERSION: ${{ github.run_number }}

      # 7. Create GitHub Release
      - name: Create GitHub Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.${{ github.run_number }}"
          name: "Release v1.${{ github.run_number }}"
          body: "Build Godot ${{ env.GODOT_VERSION }}"
          artifacts: "${{ steps.export.outputs.archive_directory }}/*.zip"
          allowUpdates: true