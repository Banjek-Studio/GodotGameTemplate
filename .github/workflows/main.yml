name: "Export & Publish (Fix)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Using the stable version 4.5.1
  GODOT_VERSION: 4.5.1
  ITCH_USER: kharachko
  # ITCH_GAME_ID береться з Settings -> Variables

jobs:
  export_game:
    runs-on: ubuntu-latest
    permissions: write-all
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Встановлення Wine (Обов'язково для Windows іконок)
      - name: Install Wine
        id: wine_install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32
          echo "WINE_PATH=$(which wine)" >> $GITHUB_OUTPUT

      # 2. Експорт проєкту
      - name: Export Godot
        id: export
        uses: firebelley/godot-export@v6
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}
          # Використовувати шляхи з export_presets.cfg
          use_preset_export_path: true

      # 3. ДЕБАГ: Показати файли (Якщо помилка - дивіться сюди в логах)
      - name: List Exported Files
        run: |
          echo "📂 Вміст папки експорту:"
          ls -R ${{ steps.export.outputs.archive_directory }}

      # 4. Deploy Windows
      # УВАГА: Переконайтеся, що в Godot пресет називається точно "Windows Desktop"
      - name: Deploy Windows
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_WINDOWS != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          # Шукаємо zip файл у папці архіву. Назва залежить від імені пресету в Godot!
          # Зазвичай це: <НазваПресету>.zip
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Windows Desktop.zip
          VERSION: ${{ github.run_number }}

      # 5. Deploy Linux
      - name: Deploy Linux
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_LINUX != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Linux.zip
          VERSION: ${{ github.run_number }}

      # 6. Deploy Web
      - name: Deploy Web
        if: success() && vars.ITCH_GAME_ID != '' && vars.DISABLE_WEB != 'true'
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
          ITCH_USER: ${{ env.ITCH_USER }}
          PACKAGE: ${{ steps.export.outputs.archive_directory }}/Web.zip
          VERSION: ${{ github.run_number }}

      # 7. Release
      - name: Create Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.${{ github.run_number }}"
          name: "Release v1.${{ github.run_number }}"
          artifacts: "${{ steps.export.outputs.archive_directory }}/*.zip"
          allowUpdates: true